        <div class="field"><label>지점 코드(S코드)</label><input class="inp" id="pfSc" value="${b?esc(pr.scode):''}" placeholder="예) S-0012"></div>
        <div class="field"><label>기본 담당자</label><select class="sel" id="pfDw"><option value="">없음</option>${workerNames().map(n=>`<option ${b&&pr.default_worker===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>별칭(엑셀·동기화 매칭용, 쉼표 구분)</label><input class="inp" id="sbAl" value="${b?esc(b.alias||''):''}" placeholder="예) 어반홀리,urban"></div>
      <p class="hint" style="margin:-4px 0 12px">지점 코드는 호스트 예약 동기화에서 지점을 맞추는 가장 정확한 기준입니다. 호스트 페이지에 적힌 코드를 그대로 넣어 두면 이름이 달라도 바로 연결돼요.</p>
      <div class="row2">
        <div class="field"><label>표준 청소 소요(분)</label><input type="number" class="inp" id="pfStd" value="${b&&raw.std_minutes!=null&&raw.std_minutes!==''?raw.std_minutes:''}" placeholder="전역 ${+S.settings.std_minutes||120}"></div>
        <div class="field"><label>입실 전 완료 버퍼(분)</label><input type="number" class="inp" id="pfBuf" value="${b&&raw.buffer_min!=null&&raw.buffer_min!==''?raw.buffer_min:''}" placeholder="전역 ${+S.settings.clean_before_min||30}"></div>
      </div>
      <div class="field"><label>중간 정리 마감 <span class="hint" style="font-weight:400">(비우면 전역 ${S.settings.mid_deadline})</span></label><input type="time" class="inp" id="pfMid" value="${b&&raw.midday_deadline?raw.midday_deadline:''}"></div>
      ${slotRow('day','낮타임')}
      ${slotRow('night','밤타임')}
      ${slotRow('allday','올데이')}
      <div class="field"><label>지점 특이규칙 <span class="hint" style="font-weight:400">(이 지점 청소 체크리스트 위에 그대로 표시)</span></label>
        <textarea class="ta" id="pfNt" placeholder="예) 분리수거는 건물 뒤편 전용 공간만 사용&#10;연박(동일 고객 연속) 시 침구 교체 생략 가능">${b?esc(pr.notes):''}</textarea></div>
      ${b?`<div class="field"><label>상태</label><select class="sel" id="sbAc"><option value="1" ${b.active!==0?'selected':''}>운영중</option><option value="0" ${b.active===0?'selected':''}>운영 중지</option></select></div>`:''}`,
      `<button class="btn" onclick="closeModal()">취소</button><button class="btn primary" id="sbGo">${b?'저장':'추가'}</button>`);
    $('#sbGo').onclick=async ()=>{
      const name=$('#sbNm').value.trim();
      if(!name){ toast('지점명을 입력해 주세요'); return; }
      const payload={name, alias:$('#sbAl').value.trim()};
      if(b) payload.active=+$('#sbAc').value;
      const slots={};
      ['day','night','allday'].forEach(k=>{ const a=$(`#pf_${k}_0`).value, z=$(`#pf_${k}_1`).value; if(a&&z) slots[k]=[a,z]; });
      const prof={
        region:$('#pfRg').value.trim(), scode:$('#pfSc').value.trim(),
        default_worker:$('#pfDw').value,
        std_minutes:$('#pfStd').value===''?null:+$('#pfStd').value,
        buffer_min:$('#pfBuf').value===''?null:+$('#pfBuf').value,
        midday_deadline:$('#pfMid').value||null,
        notes:$('#pfNt').value.trim(),
        slots_json:Object.keys(slots).length?JSON.stringify(slots):''
      };
      try{
        let bid;
        if(b){ const r=await api('/branches/'+b.id,'PATCH',payload); Object.assign(b,r.branch); bid=b.id; }
        else{ const r=await api('/branches','POST',Object.assign({sort:S.branches.length+1,active:1},payload)); S.branches.push(r.branch); bid=r.branch.id; }
        const pr2=await api('/profiles/'+bid,'POST',prof);
        S.profiles=S.profiles.filter(x=>x.branch_id!==bid); S.profiles.push(pr2.profile);
        closeModal(); toast('저장했습니다'); render();
      }catch(e){ toast(e.message); }
    };
  };
  $('#sbAdd').onclick=()=>open(null);
  $$('[data-sbe]').forEach(bt=>bt.onclick=()=>open(S.branches.find(x=>x.id===bt.dataset.sbe)));
}

function bindSetTimes(){
  $('#tmSave').onclick=async ()=>{
    const g=(k,i)=>$(`#tm_${k}_${i}`).value;
    const settings={
      times:{day:[g('day',0),g('day',1)], night:[g('night',0),g('night',1)], allday:[g('allday',0),g('allday',1)]},
      clean_before_min:+$('#tmBuf').value||30,
      mid_deadline:$('#tmMid').value||'18:30',
      std_minutes:+$('#tmStd').value||120,
      concurrent_warn:+$('#tmCw').value||3,
      quick_items:$('#tmQuick').value.split('\n').map(s=>s.trim()).filter(Boolean)
    };
    try{ await api('/settings','POST',{settings}); S.settings=settings; toast('저장했습니다. 청소 일정에 바로 반영됩니다.'); render(); }

function bindSetUsers(){
  if(S.user.role!=='owner') return;
  const open=(u)=>{
    modal(u?'계정 수정':'계정 추가', `
      <div class="row2">
        <div class="field"><label>이름</label><input class="inp" id="usNm" value="${u?esc(u.name):''}"></div>
        <div class="field"><label>아이디</label><input class="inp" id="usId" value="${u?esc(u.username):''}" ${u?'disabled':''}></div>
      </div>
      <div class="row2">
        <div class="field"><label>역할</label><select class="sel" id="usRl">${Object.entries(ROLE_LABEL).map(([k,v])=>`<option value="${k}" ${u&&u.role===k?'selected':''}>${v}</option>`).join('')}</select></div>
        <div class="field"><label>${u?'비밀번호 재설정(비우면 유지)':'비밀번호'}</label><input class="inp" id="usPw" type="password" autocomplete="new-password"></div>
      </div>
      <div class="field"><label>담당 지점 (청소근무자용 · 미선택 시 전체)</label>
        <div style="display:flex;flex-direction:column;gap:5px">
        ${activeBranches().map(b=>`<label style="display:flex;gap:8px;align-items:center;font-size:14px">
          <input type="checkbox" data-usb="${b.id}" ${u&&u.branch_ids&&u.branch_ids.includes(b.id)?'checked':''}> ${esc(b.name)}</label>`).join('')}</div></div>
      <div class="field"><label>청소 건당 단가(원)</label><input type="number" class="inp" id="usRt" value="${u?(((S.rates||[]).find(x=>x.user_id===u.id)||{}).rate??DEFAULT_RATE):DEFAULT_RATE}"></div>
      ${u?`<div class="field"><label>상태</label><select class="sel" id="usAc"><option value="1" ${u.active!==0?'selected':''}>활성</option><option value="0" ${u.active===0?'selected':''}>중지(로그인 불가)</option></select></div>`:''}`,
      `<button class="btn" onclick="closeModal()">취소</button><button class="btn primary" id="usGo">${u?'저장':'추가'}</button>`);
    $('#usGo').onclick=async ()=>{
      const name=$('#usNm').value.trim(), pw=$('#usPw').value;
      const branch_ids=$$('[data-usb]').filter(c=>c.checked).map(c=>c.dataset.usb);
      if(!name){ toast('이름을 입력해 주세요'); return; }
      try{
        let targetId;
        if(u){
          const payload={name, role:$('#usRl').value, branch_ids, active:+$('#usAc').value};
          if(pw) payload.password=pw;
          const r=await api('/users/'+u.id,'PATCH',payload); Object.assign(u,r.user); targetId=u.id;
        }else{
          const username=$('#usId').value.trim();
          if(!username||!pw){ toast('아이디와 비밀번호를 입력해 주세요'); return; }
          const r=await api('/users','POST',{name,username,password:pw,role:$('#usRl').value,branch_ids});
          S.users.push(r.user); targetId=r.user.id;
        }
        const rtv=Math.max(0, Math.round(+$('#usRt').value||0)) || DEFAULT_RATE;
        try{
          await api('/rates','POST',{user_id:targetId, rate:rtv});
          S.rates=(S.rates||[]).filter(x=>x.user_id!==targetId); S.rates.push({user_id:targetId, rate:rtv});
        }catch(e2){ /* v2 테이블 미생성 등 — 계정 저장은 유지 */ }
        closeModal(); toast('저장했습니다'); render();
      }catch(e){ toast(e.message); }
    };
  };
  $('#usAdd').onclick=()=>open(null);
  $$('[data-use]').forEach(b=>b.onclick=()=>open(S.users.find(x=>x.id===b.dataset.use)));
}

        ① Cloudflare Pages → 이 프로젝트 → Settings → <b>Bindings</b> → Add → <b>D1 database</b><br>
        ② Variable name <b>HOSTDB</b> / D1 database <b>ssople-host</b> 선택 후 저장<br>
        ③ Deployments → 최신 배포 → <b>Retry deployment</b> → 사이트 새로고침<br>
        <span class="hint">읽기 전용 용도로만 사용하며, 기존 호스트 서비스에는 영향이 없습니다.</span></div>`:''}
    `:`<p class="hint" style="margin:0;line-height:1.7">데모 모드에서는 동작하지 않습니다. 실제 배포 후 같은 Cloudflare 계정의 <b>ssople-host</b> D1을 <b>HOSTDB</b>로 연결하면, 아이디·비밀번호 없이 예약이 자동으로 들어옵니다.</p>`}
  </div>`;
}
function bindSetData(){
  const g=$('#sdGuide');
  if(g) g.onclick=()=>modal('D1 데이터베이스 연결 (약 10분, 브라우저만 필요)', `
    <ol style="margin:0;padding-left:20px;font-size:14px;line-height:1.85">
      <li>이 폴더를 GitHub 저장소에 올리고, Cloudflare Pages에서 <b>Git 연동</b>으로 배포합니다.</li>
      <li>Cloudflare 대시보드 → <b>Storage &amp; Databases → D1</b> → Create database → 이름 <b>ssople-ops</b></li>
      <li>만든 DB의 <b>Console</b> 탭에 <b>schema.sql</b> 내용 전체를 붙여넣고 실행합니다.</li>
      <li>Pages 프로젝트 → Settings → <b>Bindings</b> → D1 database 추가 → Variable name <b>DB</b> / Database <b>ssople-ops</b></li>
      <li>Deployments에서 <b>Retry deployment</b> 한 번 → 사이트 새로고침 → "처음 설정" 화면에서 대표 계정을 만들면 끝.</li>
    </ol>
    <p class="hint" style="margin-top:10px">자세한 화면 설명은 함께 드린 README 문서에 있습니다. 기존 ssople-host DB는 건드리지 않습니다.</p>`);
  const e=$('#sdExp');
  if(e) e.onclick=()=>{
    const data=localStorage.getItem(DEMO_KEY)||'{}';
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    a.download=`쏘플_공간관리_데모백업_${todayStr()}.json`; a.click();
  };
  const im=$('#sdImp');
  if(im) im.onclick=()=>$('#sdFile').click();
  const sf=$('#sdFile');
  if(sf) sf.onchange=async ()=>{
    const f=sf.files[0]; if(!f) return;
    try{
      const txt=await f.text(); JSON.parse(txt);
      localStorage.setItem(DEMO_KEY, txt);
      toast('불러왔습니다. 다시 로그인해 주세요.'); doLogout();
    }catch(err){ toast('올바른 백업 파일이 아닙니다'); }
  };
  const rs=$('#sdReset');
  if(rs) rs.onclick=async ()=>{
    if(!await confirm2('데모 데이터를 <b>모두 삭제</b>하고 처음 상태로 되돌릴까요?')) return;
    localStorage.removeItem(DEMO_KEY); localStorage.removeItem('spms_token');
    location.reload();
  };
  const sy=$('#sdSync');
  if(sy) sy.onclick=async ()=>{
    sy.disabled=true; sy.textContent='동기화 중...';
    try{
      const r=await api('/sync','POST',{});
      S.lastSync={ran_at:r.ran_at, added:r.added, updated:r.updated, removed:r.removed, skipped:r.skipped, message:''};
      await loadData(S.range.from, S.range.to);
      if(r.unmatched && r.unmatched.length){
        modal('동기화 완료 · 확인이 필요한 지점', `
          <p style="font-size:14px;margin:0 0 10px">추가 ${r.added} · 변경 ${r.updated} · 제거 ${r.removed}건을 반영했습니다.</p>
          <p style="font-size:14px;margin:0 0 6px">아래 지점은 이름을 맞추지 못해 건너뛰었어요.</p>
          <p style="font-weight:700;margin:0 0 10px">${r.unmatched.map(esc).join(', ')}</p>
          <p class="hint" style="margin:0">설정 → 직영 지점에서 해당 지점의 <b>지점 코드(S코드)</b> 또는 <b>별칭</b>에 위 이름(코드)을 그대로 넣어 두면 다음 동기화부터 자동으로 들어옵니다.</p>`,
          `<button class="btn primary" onclick="closeModal();render()">확인</button>`);
      }else{
        toast(`동기화 완료 · 추가 ${r.added} · 변경 ${r.updated} · 제거 ${r.removed}건`); render();
      }
    }catch(e){
      modal('동기화 안내', `<p style="font-size:14px;line-height:1.85;margin:0">${esc(e.message)}</p>`,
        `<button class="btn primary" onclick="closeModal()">확인</button>`);
    }finally{ sy.disabled=false; sy.textContent='지금 동기화'; }
  };
}
function vMe(){
  const u=S.user;
  layout('me', `
    <div class="card" style="max-width:480px">
      <h3>내 정보</h3>
      <div class="field"><label>이름</label><div style="font-size:15px;font-weight:700">${esc(u.name)}</div></div>
      <div class="row2">
        <div class="field"><label>아이디</label><div>${esc(u.username)}</div></div>
        <div class="field"><label>역할</label><div>${ROLE_LABEL[u.role]||u.role}</div></div>
      </div>
      ${u.role==='worker'?`<div class="field"><label>담당 지점</label><div>${u.branch_ids&&u.branch_ids.length?u.branch_ids.map(bName).map(esc).join(', '):'전체 지점'}</div></div>`:''}
      <button class="btn full" id="meLogout" style="margin-top:6px">로그아웃</button>
    </div>`);
  $('#meLogout').onclick=doLogout;
}

/* ==================================================
   렌더 디스패처 · 초기 구동
   ================================================== */
function render(){
  if(!S.user){ renderLogin(); return; }
  if(!S.loaded){ return; }
  const {page,arg}=route();
  const r=S.user.role;
  const allow={
    dash:['owner','manager','facility'],
    board:['owner','manager'],
    clean:['owner','manager','facility','worker'],
    task:['owner','manager','facility','worker'],
    fac:['owner','manager','facility','worker'],
    mkt:['owner','manager'],
    kpi:['owner','manager'],
    set:['owner','manager'],
    me:['owner','manager','facility','worker']
  };
  const p=allow[page]&&allow[page].includes(r)?page:defaultRoute().slice(2);
  if(p!==page){ location.hash='#/'+p; return; }
  if(page==='dash') vDash();
  else if(page==='board') vBoard();
  else if(page==='clean') vClean();
  else if(page==='task') vTask(decodeURIComponent(arg));
  else if(page==='fac') vFac();
  else if(page==='mkt') vMkt();
  else if(page==='kpi') vKpi();
  else if(page==='set') vSet();
  else vMe();
}

async function init(){
  $('#app').innerHTML='<div class="auth"><div class="hint">불러오는 중...</div></div>';
  let health=null;
  try{
    const res=await fetch('/api/health');
    if(res.ok) health=await res.json();
  }catch(e){}
  if(health&&health.ok){
    S.mode='api';
    if(health.needSetup){ renderSetup(); return; }
    if(localStorage.getItem('spms_token')){
      try{ await boot(); return; }catch(e){ localStorage.removeItem('spms_token'); }
    }
    renderLogin();
  }else if(health&&health.needSchema){
    renderSchemaGuide();
  }else{
    await startDemo();
  }
}
async function startDemo(){
  S.mode='demo';
  const db=demoDB();
  if(!db.users.length){ renderSetup(); return; }
  if(db.session){ try{ await boot(); return; }catch(e){} }
  renderLogin();
}
function renderSchemaGuide(){
  $('#app').innerHTML=`
  <div class="auth"><div class="authcard">
    <div class="lg"><span class="mark">S</span><h2>데이터베이스 준비 필요</h2></div>
    <p class="ds">D1 연결은 확인됐지만, 아직 테이블이 만들어지지 않았습니다.</p>
    <div class="card" style="text-align:left;font-size:13.5px;line-height:1.8;background:var(--gray-soft)">
      Cloudflare 대시보드 → <b>Storage &amp; Databases → D1</b> → 연결한 데이터베이스 선택 → <b>Console</b> 탭에서
      저장소의 <b>schema.sql</b> 내용 전체를 붙여넣고 실행해 주세요.<br>
      실행이 끝나면 아래 버튼으로 다시 확인하면 됩니다.
    </div>
    <button class="btn primary full" style="padding:12px;margin-top:14px" onclick="location.reload()">실행했어요, 다시 확인</button>
    <button class="btn full" style="padding:11px;margin-top:8px" id="sgDemo">우선 데모 모드로 둘러보기</button>
  </div></div>`;
  $('#sgDemo').onclick=()=>startDemo();
}
init();
</script>
